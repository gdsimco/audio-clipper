<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:"
    />
    <title>Audio Clipper</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="../../node_modules/lamejs/lame.min.js" defer></script>
    <script type="module" src="app.mjs"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4a1 1 0 0 0 1.52.85l11.7-7.2a1 1 0 0 0 0-1.7L8.52 3.95A1 1 0 0 0 7 4.8z" fill="currentColor" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.3" fill="currentColor" /><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3" fill="currentColor" /></symbol>
      <symbol id="i-split" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3" /><circle cx="6" cy="18" r="3" /><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12" /></symbol>
      <symbol id="i-delete" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6M18.5 6l-.8 13.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8L5.5 6" /></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 8v8M20 11v2" /></symbol>
    </svg>

    <header class="titlebar">
      <div class="file-title" id="file-title">Audio Clipper</div>
    </header>

    <main>
      <button id="empty" class="drop" type="button">
        <svg><use href="#i-wave" /></svg>
        <span><b>Drop audio here</b> or click to open</span>
      </button>

      <section id="editor" class="editor" hidden>
        <div class="row">
          <button class="play" id="btn-play" title="Play / Pause (Space)" aria-label="Play">
            <svg><use href="#i-play" id="play-icon" /></svg>
          </button>
          <canvas id="strip"></canvas>
        </div>
        <div class="row controls">
          <div class="time" id="time"></div>
          <div class="spacer"></div>
          <button class="icon" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg><use href="#i-undo" /></svg></button>
          <button class="icon" id="btn-split" title="Split at playhead (S)" aria-label="Split"><svg><use href="#i-split" /></svg></button>
          <button class="icon" id="btn-delete" title="Delete selected clip (Delete)" aria-label="Delete clip"><svg><use href="#i-delete" /></svg></button>
          <button class="done" id="btn-export" title="Export (Ctrl+S)">Export</button>
        </div>
      </section>
    </main>

    <div class="drop-overlay" id="drop-overlay">Drop to open</div>
    <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busy-text"></span></div>
    <div class="toast" id="toast" role="status"><span id="toast-text"></span><button id="toast-action" hidden></button></div>
  </body>
</html>
